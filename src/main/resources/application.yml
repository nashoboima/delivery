
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      initialization-fail-timeout: -1 

  jpa:
    hibernate:
      # ddl-auto: update
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false 

  main:
    lazy-initialization: true
  application:
    name: delivery

server:
  port: ${HTTP_PORT:8081}

---
spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: update # Включаем обновление схемы только в тестах
  
  main:
    lazy-initialization: false # В тестах инициализируем всё сразу