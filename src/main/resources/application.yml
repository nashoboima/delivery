
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:username}
    password: ${DB_PASSWORD:secret}
    #hikari:
    #  initialization-fail-timeout: -1 

  jpa:
    hibernate:
      ddl-auto: update
      # ddl-auto: none
    #show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false 
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:delivery-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  #main:
  #  lazy-initialization: true
  application:
    name: delivery

app:
  grpc:
    geo-service:
      host: ${GEO_SERVICE_GRPC_HOST:0.0.0.0}
      port: ${GEO_SERVICE_GRPC_PORT:5004}
  kafka:
    basket-events-topic: ${KAFKA_BASKETS_EVENTS_TOPIC:basket.events}

server:
  port: ${HTTP_PORT:8082}

---
spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: update # Включаем обновление схемы только в тестах
  
  main:
    lazy-initialization: false # В тестах инициализируем всё сразу